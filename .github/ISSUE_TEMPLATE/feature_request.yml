name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你遇到了什么困扰或不方便的地方？请描述场景，而不只是结论。
      placeholder: 例如：每次排查完都要手动把结论复制到别处，希望能直接导出一份报告……
    validations:
      required: true
  - type: textarea
    id: current-workaround
    attributes:
      label: 你现在的做法
      description: 目前你是怎么绕过这个问题的？（手工步骤、其它工具等）
    validations:
      required: false
  - type: textarea
    id: desired-outcome
    attributes:
      label: 期望的效果
      description: 你希望应用怎么做？描述你理想中的使用流程。
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 可接受的替代方案
      description: 如果理想方案实现成本较高，有没有你能接受的替代做法？
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: 补充说明
      description: 截图、参考产品或同类工具的类似功能、相关讨论链接等。
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ---
        **语言 / Language**：中文或英文都可以，也可以用中英双语。
        Chinese, English, or a mix of both is perfectly fine.

        贡献 / 发布相关的问题（提交规范、打包流程、如何署名等）也可以直接发邮件到
        752139192@qq.com；GitHub 没有私信功能，请不要指望能私信维护者。
        For contribution or release questions you can also email 752139192@qq.com —
        GitHub has no direct messages.
