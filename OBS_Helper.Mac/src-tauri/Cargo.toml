[package]
name = "obs-helper-mac"
version = "1.0.0"
description = "OBS 排障助手 macOS 宿主 (Tauri v2)"
authors = ["OBS Helper"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
