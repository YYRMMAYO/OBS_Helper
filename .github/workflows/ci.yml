name: Build & Package (Windows WPF)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- Windows：WPF 版（NOBS/）自包含发布 + Inno Setup 安装包 ----------------
  # 注：旧版 Blazor+WebView2 壳（OBS_Helper.Client / OBS_Helper.Win）与 Tauri（OBS_Helper.Mac）
  #     已归档，本 workflow 只构建当前维护中的 WPF 版。
  windows:
    name: Windows 安装包 (WPF -> NOBS/PAKE/windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup 6
        run: choco install innosetup -y
        shell: bash

      - name: Build & Package (installer + portable zip)
        run: ./NOBS/build.ps1 -Configuration Release -Runtime win-x64
        shell: pwsh

      - name: XAML 资源引用体检
        run: python NOBS/scripts/check_resources.py
        shell: pwsh

      - name: Upload NOBS/PAKE/windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OBS_Helper_Windows
          path: NOBS/PAKE/windows/*
          if-no-files-found: warn
