<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="OBS Helper — offline-first troubleshooting copilot for OBS Studio">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#14203a"/>
      <stop offset="100%" stop-color="#1e2f52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1050" cy="40" r="180" fill="url(#glow1)"/>
  <circle cx="120" cy="310" r="160" fill="url(#glow2)"/>

  <!-- logo mark -->
  <rect x="72" y="104" width="64" height="64" rx="16" fill="url(#accent)"/>
  <path d="M96 122 L96 150 L122 136 Z" fill="#0b1220"/>

  <text x="160" y="165" font-family="Segoe UI, Arial, 'Microsoft YaHei', sans-serif" font-size="68" font-weight="700" fill="#f8fafc">OBS Helper</text>
  <text x="163" y="216" font-family="Segoe UI, Arial, 'Microsoft YaHei', sans-serif" font-size="24" fill="#94a3b8">Troubleshooting copilot for OBS Studio · offline-first · privacy-first</text>

  <!-- feature chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="880" y="120" width="248" height="38" rx="19" fill="none" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="1004" y="145" text-anchor="middle" fill="#7dd3fc">Offline-First</text>
    <rect x="880" y="170" width="248" height="38" rx="19" fill="none" stroke="#818cf8" stroke-opacity="0.55"/>
    <text x="1004" y="195" text-anchor="middle" fill="#a5b4fc">Native WPF · .NET 10</text>
    <rect x="880" y="220" width="248" height="38" rx="19" fill="none" stroke="#94a3b8" stroke-opacity="0.5"/>
    <text x="1004" y="245" text-anchor="middle" fill="#cbd5e1">Windows 10 / 11</text>
  </g>

  <rect y="314" width="1200" height="6" fill="url(#accent)"/>
</svg>
