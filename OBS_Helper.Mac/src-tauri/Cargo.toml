[package]
name = "obs-helper-mac"
version = "1.4.3"
description = "OBS 排障助手 macOS 宿主 (Tauri v2)"
authors = ["OBS Helper"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 机密加密落盘：macOS 走系统钥匙串（等价于 Windows 侧的 DPAPI）。
# 只启用 apple-native；在非 Apple 平台上 keyring 会退化为内存 mock 存储，
# 因此在 Windows/Linux 上做 `cargo check` 依然能编译通过。
keyring = { version = "3", features = ["apple-native"] }
# OBS 配置备份 / 导入：zip 打包与解包（含 Zip Slip / 炸弹防护）
zip = "2"
# 原生文件对话框（保存 / 打开 / 选择目录），官方插件，跨平台一致
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
